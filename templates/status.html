<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>เปลี่ยนสถานะ</title>
</head>

<body>

<h1>เปลี่ยนสถานะการซ่อม</h1>

<p>ชื่อ : {{ repair[1] }}</p>

<p>อุปกรณ์ : {{ repair[3] }}</p>

<form method="POST">

<label>สถานะ</label>

<select name="status">

    <option>รอดำเนินการ</option>
    <option>กำลังตรวจสอบ</option>
    <option>กำลังซ่อม</option>
    <option>ซ่อมเสร็จ</option>
    <option>ยกเลิก</option>

</select>

<br><br>

<label>อะไหล่ที่เปลี่ยน</label>
<input type="text" name="parts"
value="{{ repair[9] if repair[9] else '' }}">

<br><br>

<label>ราคาอะไหล่ (บาท)</label>
<input type="number" name="parts_price"
value="{{ repair[10] if repair[10] else 0 }}">

<br><br>

<label>ค่าแรง (บาท)</label>
<input type="number" name="labor_price"
value="{{ repair[11] if repair[11] else 0 }}">

<br><br>

<label>ส่วนลด (บาท)</label>
<input type="number" name="discount"
value="{{ repair[12] if repair[12] else 0 }}">

<br><br>

<label>หมายเหตุ</label>

<textarea name="note">
{{ repair[14] if repair[14] else '' }}
</textarea>

<br><br>

<button type="submit">
บันทึก
</button>

</form>
