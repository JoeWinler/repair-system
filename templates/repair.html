<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>แจ้งซ่อมอุปกรณ์</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="container">

    <h1>🛠 แจ้งซ่อมอุปกรณ์</h1>

    <form method="POST" enctype="multipart/form-data">

        <label>ชื่อผู้แจ้ง</label>
        <input type="text" name="fullname" required>

        <label>แผนก</label>
        <input type="text" name="department" required>

        <label>อุปกรณ์</label>
        <input type="text" name="equipment" required>

        <label>อาการเสีย</label>
        <textarea name="problem" rows="5" required></textarea>

        <label>แนบรูปภาพ</label>
        <input type="file" name="image" accept="image/*">

        <label>แนบวิดีโอ</label><br>
        <input type="file"
        name="video"
        accept="video/mp4,video/mov,video/avi,video/webm"><br><br>

        <br><br>

        <button type="submit">
            บันทึกการแจ้งซ่อม
        </button>

    </form>

    <br>

    <a href="/dashboard">⬅ กลับ Dashboard</a>

</div>

</body>
</html>
